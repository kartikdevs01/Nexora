<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexora — Story</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/story-3d.css">
</head>
<body class="story-page">
  <header class="topbar story-topbar">
    <a class="brand" href="index.html" aria-label="Nexora home"><i>N</i>Nexora</a>
    <nav class="desktop-nav" aria-label="Main navigation"><a href="index.html#india">India</a><a href="index.html#world">World</a><a href="briefing.html">Briefing</a></nav>
    <div class="nav-actions"><a class="button compact" href="index.html">Home</a></div>
  </header>
  <main id="story-main">
    <div class="story-ambient ambient-one" aria-hidden="true"></div><div class="story-ambient ambient-two" aria-hidden="true"></div>
    <article class="story-experience" data-story-experience>
      <section class="story-hero-3d" aria-labelledby="story-title">
        <div class="hero-glass-layer hero-glass-back" aria-hidden="true"></div>
        <div class="story-hero-media" id="story-media" hidden><img id="story-image" alt="" decoding="async"><div class="media-sheen" aria-hidden="true"></div></div>
        <div class="story-hero-copy">
          <div class="story-kicker"><span id="story-category">Story</span><span class="kicker-dot">•</span><span id="story-topic"></span></div>
          <h1 id="story-title">Loading story…</h1>
          <p class="story-dek" id="story-summary"></p>
          <div class="story-details"><span id="story-source-name"></span><span id="story-time"></span><span id="story-read"></span></div>
          <div id="story-source" class="story-cta"></div>
        </div>
      </section>
      <div class="story-reading-shell">
        <aside class="story-rail" aria-label="Story information"><span>01</span><i></i><span>READ</span></aside>
        <div class="story-content">
          <div id="story-body" class="story-body" aria-live="polite"></div>
          <section class="story-context" id="story-context" hidden><span class="eyebrow">Why this matters</span><p id="story-context-text"></p></section>
        </div>
      </div>
    </article>
  </main>
  <footer class="story-footer"><div class="footer-bottom"><span>© 2026 Nexora, Inc.</span><div><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></footer>
  <script src="js/data.js"></script><script src="js/app.js"></script><script src="js/pages.js"></script>
</body></html>
